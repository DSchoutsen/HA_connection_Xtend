- sensor:
    - name: xtreme_tBoilerSupply
      unique_id: 4ecd2fc5-4895-4eee-9faf-d4f40a74b1f1
      unit_of_measurement: "°C"
      state: >
        {{ state_attr('sensor.Intergas_Xtreme', 'stats')['625b'] | int / 100 }}
      icon: mdi:water-thermometer

    - name: xtreme_tBoilerReturn
      unique_id: cdfb249d-a49d-4df0-a4bc-b7e2b9cc77d2
      unit_of_measurement: "°C"
      state: >
        {{ state_attr('sensor.Intergas_Xtreme', 'stats')['623c'] | int / 100 }}
      icon: mdi:water-thermometer-outline

    - name: xtreme_burner_status
      unique_id: af8128bb-51b3-4bbe-bbc6-dca209d68bb1
      state: >
        {% set raw_value = state_attr('sensor.Intergas_Xtreme', 'stats')['7e7a'] | int(default=-1) %}
        {% set statuses = {
          0: 'Startup',
          1: 'Interpurge',
          2: 'Postpurge',
          4: 'Prepurge',
          8: 'Ignition',
          16: 'Waiting',
          32: 'Running',
          64: 'Rest',
          128: 'Lockout'
        } %}
        {% if raw_value == -1 %}
          unavailable
        {% else %}
          {{ statuses.get(raw_value, 'Unknown (' ~ raw_value ~ ')') }}
        {% endif %}
      icon: >
        {% set status = states('sensor.xtreme_burner_status') %}
        {% set active_states = ['Running', 'Ignition'] %}
        {% set purge_states = ['Prepurge', 'Interpurge', 'Postpurge'] %}
        {% set idle_states = ['Waiting', 'Rest', 'Startup'] %}
        
        {% if status == 'Lockout' %}
          mdi:lock-alert
        {% elif status in active_states %}
          mdi:fire
        {% elif status in purge_states %}
          mdi:fan
        {% elif status in idle_states %}
          mdi:power-off
        {% else %}
          mdi:fire-outline
        {% endif %}

    - name: xtreme_gas_meter_ch
      unique_id: d8860817-e21a-4503-8169-c89520b7d14e
      device_class: volume
      unit_of_measurement: "m³"
      state: >
        {{ state_attr('sensor.Intergas_Xtreme', 'stats')['7191'] | int / 10000 }}
      icon: mdi:gauge

