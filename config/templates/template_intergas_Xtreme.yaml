    # Custom calculated xtreme entities

    - name: xtreme_deltaT
      unique_id: e31b8d3d-5357-430b-8f1b-e814ea915c1e
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      state: >
        {% set supply = states('sensor.xtreme_tBoilerSupply') | float('nan') %}
        {% set return = states('sensor.xtreme_tBoilerReturn') | float('nan') %}
        {% if supply != supply or return != return %}
          unavailable
        {% else %}
          {{ (supply - return) | round(1) }}
        {% endif %}
      icon: >
        {% set delta = states('sensor.xtreme_deltaT') | float(0) %}
        {% if delta > 10 %}
          mdi:thermometer-high
        {% elif delta > 5 %}
          mdi:thermometer-check
        {% elif delta > 0 %}
          mdi:thermometer-low
        {% else %}
          mdi:thermometer-off
        {% endif %}
      availability: >
        {{ states('sensor.xtreme_tBoilerSupply') not in ['unknown', 'unavailable', 'none'] and 
            states('sensor.xtreme_tBoilerReturn') not in ['unknown', 'unavailable', 'none'] }}

    - name: xtreme_efficiency
      unique_id: b5318c85-ed74-4574-b6f7-bf0e0a25bc34
      unit_of_measurement: "kWh/m³"
      state_class: measurement
      state: >
        {% set thermal = states('sensor.xtend_thermalEnergyBoiler') | float(0) %}
        {% set gas = states('sensor.xtreme_gas_meter_ch') | float(0) %}
        {% if gas <= 0 %}
          0
        {% else %}
          {{ (thermal / gas) | round(3) }}
        {% endif %}
      icon: >
        {% set eff = states('sensor.xtreme_efficiency') | float(0) %}
        {% if eff >= 10 %}
          mdi:gauge-full
        {% elif eff >= 8 %}
          mdi:gauge
        {% elif eff > 0 %}
          mdi:gauge-empty
        {% else %}
          mdi:gauge-off
        {% endif %}
      availability: >
        {{ states('sensor.xtend_thermalEnergyBoiler') not in ['unknown', 'unavailable', 'none'] and 
            states('sensor.xtreme_gas_meter_ch') not in ['unknown', 'unavailable', 'none'] }}

- binary_sensor:
    - name: "Xtreme Active Check"
      unique_id: 0e3bae55-3c03-4722-a306-b919c78f0cb8
      state: "{{ states('sensor.xtreme_deltat') | float(0) > 0.5 }}"
      icon: >
        {% if states('sensor.xtreme_deltat') | float(0) > 0.5 %}
          mdi:fire
        {% else %}
          mdi:fire-off
        {% endif %}
